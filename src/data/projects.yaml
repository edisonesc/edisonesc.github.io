- id: issue-agent
  name: Issue Agent — GitHub Issue to Pull Request Bot (POC)
  start: Nov 2026
  end: Nov 2026
  description: Proof of concept that uses an AI model to turn a GitHub issue into a pull request. A person decides when it starts and reviews everything before it is merged. The tool runs its own checks (lint, type-check, build) on the model's work and only opens a pull request if they pass. The AI model can be swapped without changing the code. Built with AI assistance to explore how far a supervised agent can go on small site changes, and tried out on this portfolio's repository.
  url: https://github.com/edisonesc/issue-agent
  type: others
  technologies:
    [typescript, nodejs, githubactions, promptengineering, contextengineering, loopengineering, deepseek, openai]

- id: laya-issue-triage
  name: Laya Issue Triage — AI GitHub Issue Labelling Bot (POC)
  start: Oct 2026
  end: Nov 2026
  description: Proof of concept for automated GitHub issue triage. A TypeScript GitHub Action on a self-hosted runner labels each issue by type, urgency and missing info, with confidence thresholds, a needs-triage fallback, and state tracking so maintainer labels are never overridden. The labelling backend is swappable: a self-hosted Laya decision model (structured probabilities in one forward pass, no parsing), or a local Ollama model (D3:2b or D3:4b) behind a Laya-compatible shim, which trades that structure for a more flexible generative model. Laya was evaluated on 44 real issues plus a 25-issue holdout (type 95%, priority 60%).
  type: others
  technologies:
    [laya, ollama, typescript, nodejs, githubactions, docker, python, promptengineering]

- id: sesh-it
  name: Sesh It — Online Multiplayer 3D Boxing Game
  start: Oct 2026
  end: Present
  description: Browser-based 3D boxing game with online multiplayer, built as a TypeScript monorepo. A deterministic 60 Hz simulation shared by client and server powers rollback netcode, verified identical across Node, Chromium, Firefox and WebKit in CI. React Three Fiber/Rapier client, NestJS API with PostgreSQL and Redis sessions, and a Colyseus game server that scales through Redis and was load-tested to ~150 concurrent fights per process. Deployed with Docker, Caddy and Cloudflare Tunnel. Leveraged agents through spec-first workflows, retaining ownership of architecture, technical constraints, and automated validation.
